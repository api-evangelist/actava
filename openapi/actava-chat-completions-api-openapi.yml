openapi: 3.2.0
info:
  title: Actava.ai Cura Chat API
  version: 1.0.0
  summary: OpenAI-compatible API for Cura 1T, Actava.ai's healthcare language model.
  description: The Cura API serves Cura 1T, Actava.ai's 1T-parameter healthcare language model, through an OpenAI-compatible interface at https://inference.actava.ai/v1.
  termsOfService: https://www.actava.ai/terms
  contact:
    name: Actava.ai
    url: https://www.actava.ai/contact
    email: support@actava.ai
servers:
- url: https://inference.actava.ai/v1
  description: Cura 1T inference gateway (OpenAI-compatible)
security:
- bearerAuth: []
tags:
- name: Chat Completions
  description: Generate a model response for a conversation.
paths:
  /chat/completions:
    post:
      operationId: createChatCompletion
      tags:
      - Chat Completions
      summary: Create a chat completion
      description: Generates a model response for a conversation.
      externalDocs:
        url: https://www.actava.ai/cura/docs/api
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatCompletionRequest'
      responses:
        '200':
          description: The completion.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatCompletion'
components:
  schemas:
    ChatCompletionRequest:
      type: object
      description: Referenced by this document but never defined in it. API Evangelist added this empty placeholder so the document resolves; the shape is unknown and is NOT a claim about the API.
      x-ae-placeholder: true
    ChatCompletion:
      type: object
      description: Referenced by this document but never defined in it. API Evangelist added this empty placeholder so the document resolves; the shape is unknown and is NOT a claim about the API.
      x-ae-placeholder: true
